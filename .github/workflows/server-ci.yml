name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'minigames/**'
      - 'data/places/**'
      - 'tools/*place*'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'minigames/**'
      - 'data/places/**'
      - 'tools/*place*'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZRIDE_PORT: '18000'
      ZRIDE_SMOKE_BASE_URL: http://127.0.0.1:18000
      ZRIDE_SMOKE_STATE_FILE: /tmp/zride-persistence-smoke.json
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test server and API contract
        run: npm test
      - name: Validate checked-in place catalog and server conversion
        run: |
          python3 ../tools/validate-place-catalog.py
          python3 ../tools/test-place-review.py
          node tools/import-github-places.mjs /tmp/zride-places.json --with-demo
      - name: Validate deployment archive boundary
        run: |
          python3 deploy/test_archive.py
          python3 deploy/test_pull_deploy.py
          git archive --format=tar.gz --prefix=z-ride-ci/ HEAD > "$RUNNER_TEMP/zride-source.tar.gz"
          python3 -c "import runpy, sys; from pathlib import Path; runpy.run_path('deploy/pull-deploy.py')['runtime_bundle'](Path(sys.argv[1]).read_bytes())" "$RUNNER_TEMP/zride-source.tar.gz"
          python3 deploy/pleos-viewer/test_viewer.py
          python3 deploy/pleos-viewer/test_simulation.py
      - name: Validate Compose configuration
        run: docker compose --project-name zride-ci config --quiet
      - name: Build and start SQLite-backed container
        run: docker compose --project-name zride-ci up --detach --build
      - name: Seed approved room and collected inventory
        run: node deploy/persistence-smoke.mjs seed
      - name: Gracefully restart container
        run: docker compose --project-name zride-ci restart --timeout 10 api
      - name: Verify persistent session room approval and inventory
        run: node deploy/persistence-smoke.mjs verify
      - name: Kill process and recreate container with the same data volume
        run: |
          docker update --restart=no "$(docker compose --project-name zride-ci ps --quiet api)"
          docker compose --project-name zride-ci kill --signal SIGKILL api
          docker compose --project-name zride-ci rm --force api
          docker compose --project-name zride-ci up --detach --no-build api
      - name: Verify durable commit and idempotent reward after process kill
        run: node deploy/persistence-smoke.mjs verify
      - name: Stop container gracefully
        run: docker compose --project-name zride-ci stop --timeout 10 api
      - name: Show logs and remove disposable CI resources
        if: always()
        run: |
          docker compose --project-name zride-ci logs --no-color api
          docker compose --project-name zride-ci down --volumes --remove-orphans
