name: Server release to Proxmox

on:
  workflow_run:
    workflows: ['Server CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zride-proxmox-release
  cancel-in-progress: false

jobs:
  bundle:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out tested main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Resolve immutable revision
        id: revision
        run: |
          revision=$(git rev-parse HEAD)
          test "${#revision}" -eq 40
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Verify server contract before packaging
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Bundle runtime source without secrets dependencies or database
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          archive="$RUNNER_TEMP/zride-server-${REVISION}.tar.gz"
          LC_ALL=C tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -- package.json package-lock.json ./*.mjs observer
          cd "$RUNNER_TEMP"
          sha256sum "zride-server-${REVISION}.tar.gz" > SHA256SUMS
      - name: Upload immutable server bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zride-server-${{ steps.revision.outputs.sha }}
          path: |
            ${{ runner.temp }}/zride-server-${{ steps.revision.outputs.sha }}.tar.gz
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  deploy:
    needs: bundle
    if: vars.ZRIDE_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, zride-deploy]
    environment: proxmox-demo
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download tested server bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zride-server-${{ needs.bundle.outputs.revision }}
          path: ${{ runner.temp }}/zride-server
      - name: Verify bundle and invoke fixed deployment entry point
        env:
          REVISION: ${{ needs.bundle.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/zride-server"
          sha256sum --check SHA256SUMS
          install -m 600 "zride-server-${REVISION}.tar.gz" "/srv/zride/incoming/zride-server-${REVISION}.tar.gz"
          digest=$(sha256sum "zride-server-${REVISION}.tar.gz" | cut -d ' ' -f 1)
          sudo /usr/local/sbin/zride-deploy "$REVISION" "$digest"
