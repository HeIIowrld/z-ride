<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a1c">
  <title>PLY 충전소</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <span class="mark">P</span>
    <div><b>PLY 충전소</b><small>충전하는 동안 다 같이</small></div>
  </header>
  <main>
    <section class="hero">
      <p class="label">CHARGE &amp; PLAY</p>
      <h1>충전하는 20분,<br><em>다 같이 한 판.</em></h1>
      <p class="lead">한 명이 큰 화면에서 방을 열고, 나머지는 폰으로 QR을 찍어 들어와요. 앱 설치는 필요 없어요.</p>
      <ol class="how">
        <li><b>1</b><span>큰 화면(차 화면·태블릿·노트북)에서 <strong>방 만들기</strong></span></li>
        <li><b>2</b><span>폰 카메라로 화면의 <strong>QR 찍기</strong></span></li>
        <li><b>3</b><span>차 화면에 뜨는 <strong>규칙 보고 시작</strong></span></li>
      </ol>
    </section>
    <p class="label section">GAME SELECT</p>
    <h2 class="section-title">게임 고르기</h2>
    <div id="games" class="games"></div>
    <p class="foot">주행 중에는 하지 마세요. 차에 앉아 있다면 P단에서만 즐겨 주세요.</p>
  </main>
  <script src="/hub.js"></script>
</body>
</html>
