<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pleos 차량 화면</title><link rel="stylesheet" href="/vehicles/style.css"><script type="module" src="/vehicles/viewer.js"></script><script type="module" src="/vehicles/simulation.js"></script></head><body class="viewer"><header><a href="/vehicles/">← 차량 목록</a><h1 id="title">실제 Pleos 센터페시아</h1><span class="tag">INTERACTIVE / LIVE SCREEN</span></header><p id="status" role="status">차량 실행 상태 확인 중…</p><details id="journey"><summary>이동·경로 변경 시뮬레이션</summary><p>DEMO_ROUTE · 내비 SDK 자동 길찾기와 별도의 시험 경로임. 폰의 실제 GPS는 변경하지 않음.</p><div class="journey-controls"><label>목적지 <select id="route"><option value="A">여의도 동쪽 스팟</option><option value="B">여의도 서쪽 스팟</option></select></label><label>속도 <select id="speed"><option value="10">10km/h</option><option value="30" selected>30km/h</option><option value="60">60km/h</option></select></label><label>시간 배속 <select id="rate"><option value="1">1배</option><option value="5" selected>5배</option><option value="10">10배</option></select></label><button data-action="destination">목적지 설정</button><button data-action="start">이동 시작 / 재개</button><button data-action="reroute">선택 목적지로 경로 변경</button><button data-action="pause">일시정지 (D)</button><button data-action="park">정차·주차 (P)</button><button data-action="cancel">안내 취소</button><a id="console-link" target="_blank" rel="noopener">공식 차량 콘솔 ↗</a></div><p id="journey-status" role="status">상태 확인 중…</p><p id="journey-result" role="status"></p><svg id="journey-map" viewBox="0 0 600 160" aria-label="데모 경로와 현재 위치"></svg></details><div id="screen"></div><p class="muted">Pleos AVD의 실제 화면을 송출함. 화면을 클릭·드래그·스크롤해 직접 조작함. 같은 차량의 조작은 모두가 공유하므로 한 명씩 승인해 주세요.</p></body></html>
