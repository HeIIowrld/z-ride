name: zride-demo
services:
  api:
    image: ${ZRIDE_IMAGE:-zride-room-server:demo}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8000"
      ZRIDE_DB_PATH: /data/zride.sqlite
      ZRIDE_OBSERVER_TOKEN: ${ZRIDE_OBSERVER_TOKEN:-}
    ports:
      - "${ZRIDE_BIND_ADDR:-127.0.0.1}:${ZRIDE_PORT:-8000}:8000"
    volumes:
      - zride-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  zride-data:
