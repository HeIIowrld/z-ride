<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09121b"><title>실시간 운전면허시험 · PLY</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="game.css"></head>
<body class="game-page"><header class="game-nav"><a href="../../index.html" class="back-link">‹ PLY</a><span class="nav-title">실시간 운전면허시험</span><span></span></header><main class="quiz-wrap"><section class="quiz-stage">
<div class="quiz-top"><span>주행 중</span><span>점수 <b id="score">0</b></span><span>정답 <b id="correct">0</b></span><span>콤보 <b id="combo">0</b></span></div>
<section id="waiting" class="quiz-screen"><p class="eyebrow">DRIVE QUIZ</p><h1>드라이브 중</h1><p>다음 문제 대기 중</p><p id="idle-note" class="muted">트리거가 없으면 5분마다 일반 문제가 출제됩니다.</p><div class="quiz-actions"><button id="review-button" class="secondary-button" disabled>오답노트 복습</button><button id="end-button" class="primary-button">드라이브 종료</button></div></section>
<section id="banner" class="quiz-banner hidden" role="button" tabindex="0"><strong id="banner-text">방금 지나간 표지판, 무슨 뜻일까?</strong><span>눌러서 문제 풀기</span><div class="timer-track"><i id="banner-progress"></i></div></section>
<section id="question" class="quiz-screen hidden"><div class="quiz-clock"><span>남은 시간</span><b id="time-left">20</b></div><div id="sign" class="sign"></div><h2 id="question-text"></h2><div id="choices" class="choices"></div><small>문제는 검수 전 초안입니다</small></section>
<section id="result" class="quiz-screen hidden"><p class="eyebrow" id="result-label">결과</p><h2 id="result-title"></h2><p id="explanation"></p><p class="legal" id="legal"></p><p id="reward" class="item-inline"></p><button id="continue-button" class="primary-button">계속</button></section>
<section id="report" class="quiz-screen hidden"><p class="eyebrow">DRIVE REPORT</p><h1>드라이브 성적표</h1><div id="report-content"></div><button id="report-close" class="primary-button">허브로</button></section>
<section id="review" class="quiz-screen hidden"><p class="eyebrow">WRONG NOTE</p><h2>오답노트 복습</h2><p id="review-question"></p><div id="review-choices" class="choices"></div><button id="review-close" class="secondary-button">복습 마치기</button></section>
</section><p class="quiz-foot">동승자 전용 · 운전자는 조작하지 마세요.</p></main><script type="module" src="game.js"></script></body></html>
