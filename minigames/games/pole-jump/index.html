<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09121b"><title>폴짝 전봇대 · PLY</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="game.css"></head><body class="game-page"><header class="game-nav"><a href="../../index.html" class="back-link">PLY</a><span class="nav-title">폴짝 전봇대</span><button id="mute" class="icon-button" aria-label="소리 끄기">◖</button></header><main class="stage-wrap"><section class="stage"><canvas id="game"></canvas><div class="hud"><div class="hud-score"><small>점수</small><strong id="score">0</strong></div><div class="hud-stats"><span>연속 <b id="combo">0</b></span><span>부품 <b id="parts">0</b></span></div><div class="speed-sign"><span></span><div><b id="speed">0</b><small id="limit">제한 —</small></div></div></div><div class="toast" id="toast"></div><p id="jump-hint" role="status" hidden></p><div class="pause-layer hidden" id="pause"><div class="pause-card"><span>정차 중</span><h2>잠시 멈췄어요</h2><p>차량이 움직이면 다시 시작해요.</p></div></div><div class="overlay" id="start"><div class="overlay-card"><p class="eyebrow">폴짝 전봇대</p><h1>폴짝<br><em>전봇대</em></h1><p>다음 전봇대가 창 안에 보이면 탭해서 점프해요.<br>위아래로 밀어 발판을 옮기고 장애물을 피해요.</p><div class="key-hint"><span class="touch-hint">화면 아래 버튼으로 조작하세요</span><span class="keyboard-hint"><kbd>SPACE</kbd> 점프 <kbd>↑ ↓</kbd> 발판 이동</span></div><button id="start-button" class="primary-button" disabled>시작하기</button><small>안전한 환경에서 플레이해 주세요</small></div></div><button id="finish-run" class="hidden route-finish" type="button">결과 보기</button><div class="overlay hidden" id="result"><div class="overlay-card result-card"><p class="eyebrow">주행 결과</p><h2 id="result-title">도전 종료</h2><p class="reason" id="reason"></p><div class="result-score"><small>최종 점수</small><strong id="final-score">0</strong></div><div class="result-grid"><div><small>옮긴 전봇대</small><b id="final-poles">0</b></div><div><small>최고 연속</small><b id="final-combo">0</b></div><div><small>완벽 착지</small><b id="final-perfects">0</b></div><div><small>플레이 시간</small><b id="final-time">0:00</b></div><div><small>획득 부품</small><b id="final-parts">0</b></div></div><p class="new-best hidden" id="best-badge">새 최고 기록</p><div class="result-actions"><button class="primary-button" id="again">다시하기</button></div></div></div><button class="jump-control" id="jump">점프</button><div class="height-control"><button id="up" aria-label="높은 발판">↑</button><span id="height-name">가운데</span><button id="down" aria-label="낮은 발판">↓</button></div></section><p class="orientation-note">가로 화면에서 더 넓은 풍경을 볼 수 있어요</p></main><script type="module" src="game.js"></script></body></html>
